<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:" />
    <title>OpenFit</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background: #15181d;
        color: #eef1f5;
        font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
      }
      .plate {
        width: 46px;
        height: 46px;
        border-radius: 50%;
        background: #f4f5f7;
        box-shadow:
          inset 0 0 0 15px #f4f5f7,
          inset 0 0 0 46px rgb(0 0 0 / 0.28);
        animation: pulse 1.4s ease-in-out infinite;
      }
      h1 {
        margin: 0;
        font-size: 26px;
        font-weight: 700;
        letter-spacing: 0.02em;
      }
      p {
        margin: 0;
        color: #a1aab6;
      }
      @keyframes pulse {
        50% {
          transform: scale(0.88);
          opacity: 0.7;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .plate {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="plate" aria-hidden="true"></div>
    <h1>OpenFit</h1>
    <p>Opening your progress…</p>
  </body>
</html>
