<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self'" />
    <title>OpenFit</title>
    <style>
      :root {
        --bg: #15181d;
        --card: #1c2027;
        --raised: #242932;
        --line: #2f3540;
        --text: #eef1f5;
        --muted: #a1aab6;
        --faint: #6f7884;
        --accent: #f4f5f7;
        --accent-ink: #15181d;
        --green: #4ade80;
        --amber: #fbbf24;
        --red: #f87171;
        --focus: #7dd3fc;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: "Segoe UI Variable Text", "Segoe UI", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        font-size: 15px;
        line-height: 1.5;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 32px 16px;
        overflow-y: auto;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-bottom: 22px;
      }
      .brand img {
        width: 52px;
        height: 52px;
        border-radius: 14px;
      }
      .brand h1 {
        margin: 0;
        font-size: 26px;
        font-weight: 700;
        letter-spacing: 0.01em;
      }
      .brand p {
        margin: 0;
        color: var(--muted);
        font-size: 14px;
      }
      .chip {
        margin-left: 6px;
        padding: 1px 8px;
        border: 1px solid var(--line);
        border-radius: 999px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 600;
        vertical-align: 3px;
      }
      .card {
        width: 100%;
        max-width: 600px;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 28px 28px 24px;
        box-shadow: 0 18px 50px rgb(0 0 0 / 0.35);
      }
      .card h2 {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 0 0 8px;
        font-size: 20px;
        font-weight: 650;
      }
      .card > p,
      .note {
        margin: 0 0 18px;
        color: var(--muted);
      }
      .tone {
        flex: none;
        width: 22px;
        height: 22px;
      }
      .tone.warning {
        color: var(--amber);
      }
      .tone.error {
        color: var(--red);
      }
      .tone.ok {
        color: var(--green);
      }
      .field {
        margin: 0 0 16px;
      }
      .field label,
      .label {
        display: block;
        margin-bottom: 6px;
        color: var(--muted);
        font-size: 13px;
        font-weight: 600;
      }
      .path-row {
        display: flex;
        gap: 8px;
      }
      .path {
        flex: 1;
        min-width: 0;
        padding: 9px 12px;
        background: var(--raised);
        border: 1px solid var(--line);
        border-radius: 10px;
        font-family: "Cascadia Mono", Consolas, monospace;
        font-size: 13px;
        overflow-wrap: anywhere;
      }
      .option {
        display: flex;
        gap: 14px;
        align-items: flex-start;
        margin: 0 0 20px;
        padding: 14px;
        background: var(--raised);
        border: 1px solid var(--line);
        border-radius: 12px;
        cursor: pointer;
      }
      .option strong {
        display: block;
        font-weight: 600;
      }
      .option span {
        color: var(--muted);
        font-size: 13.5px;
      }
      .switch {
        position: relative;
        flex: none;
        width: 42px;
        height: 24px;
        margin-top: 1px;
      }
      .switch input {
        position: absolute;
        inset: 0;
        margin: 0;
        opacity: 0;
        cursor: pointer;
      }
      .switch i {
        position: absolute;
        inset: 0;
        border-radius: 999px;
        background: var(--line);
        transition: background 0.15s;
      }
      .switch i::after {
        content: "";
        position: absolute;
        top: 3px;
        left: 3px;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: var(--text);
        transition: transform 0.15s;
      }
      .switch input:checked + i {
        background: var(--green);
      }
      .switch input:checked + i::after {
        transform: translateX(18px);
        background: var(--accent-ink);
      }
      .switch input:focus-visible + i {
        outline: 2px solid var(--focus);
        outline-offset: 2px;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px;
        margin-top: 4px;
      }
      .spacer {
        flex: 1;
      }
      button {
        font: inherit;
        font-weight: 600;
        border-radius: 10px;
        padding: 9px 16px;
        border: 1px solid var(--line);
        background: var(--raised);
        color: var(--text);
        cursor: pointer;
      }
      button:hover {
        border-color: var(--faint);
      }
      button:focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: 2px;
      }
      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--accent-ink);
      }
      button.primary:hover {
        background: #fff;
      }
      button.quiet {
        background: none;
        border-color: transparent;
        color: var(--muted);
      }
      button.quiet:hover {
        color: var(--text);
      }
      pre {
        max-height: 180px;
        overflow: auto;
        margin: 0 0 18px;
        padding: 10px 12px;
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 10px;
        color: var(--muted);
        font-size: 12px;
        white-space: pre-wrap;
      }
      .status {
        display: flex;
        align-items: center;
        gap: 16px;
      }
      .status p {
        margin: 2px 0 0;
        color: var(--muted);
      }
      .spinner {
        flex: none;
        width: 30px;
        height: 30px;
        border: 3px solid var(--line);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .spinner {
          animation-duration: 3s;
        }
      }
      footer {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-items: center;
        gap: 6px 14px;
        margin-top: 18px;
        color: var(--faint);
        font-size: 13px;
      }
      footer button {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        padding: 5px 10px;
        font-size: 13px;
        color: var(--muted);
        background: none;
      }
      footer svg {
        width: 16px;
        height: 16px;
        fill: currentColor;
      }
      .hidden {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div class="brand">
      <img src="build/icon.png" alt="" />
      <div>
        <h1>OpenFit <span class="chip" id="version"></span></h1>
        <p>Private fitness tracking that runs on your own PC. Free and open source.</p>
      </div>
    </div>

    <main class="card" id="card" aria-live="polite">
      <div class="status">
        <div class="spinner" aria-hidden="true"></div>
        <div><strong>Opening OpenFit…</strong></div>
      </div>
    </main>

    <footer>
      <button type="button" id="source" title="Opens github.com/Vitzso/open-fit in your browser">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8a8 8 0 0 0 5.47 7.59c.4.07.55-.17.55-.38v-1.33c-2.23.48-2.7-1.07-2.7-1.07-.36-.92-.89-1.17-.89-1.17-.73-.5.06-.49.06-.49.8.06 1.23.83 1.23.83.72 1.22 1.88.87 2.33.66.07-.52.28-.87.5-1.07-1.78-.2-3.65-.89-3.65-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.6 7.6 0 0 1 4 0c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48v2.2c0 .21.15.46.55.38A8 8 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>
        Source code on GitHub
      </button>
      <span>MIT license</span>
      <span>Everything stays on this PC</span>
    </footer>

    <script src="setup.js"></script>
  </body>
</html>
